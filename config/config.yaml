# Configuration file for churn prediction project

data:
  n_samples: 5000
  test_size: 0.2
  random_state: 42
  output_path: "data/customer_data.csv"

preprocessing:
  numerical_features:
    - tenure
    - monthly_charges
    - total_charges
  categorical_features:
    - contract
    - payment_method
    - internet_service
  target: churn

models:
  logistic_regression:
    enabled: true
    params:
      max_iter: 1000
      random_state: 42
      
  random_forest:
    enabled: true
    params:
      n_estimators: 100
      max_depth: 10
      random_state: 42
      
  xgboost:
    enabled: true
    params:
      n_estimators: 100
      max_depth: 5
      learning_rate: 0.1
      random_state: 42

training:
  model_save_path: "models/"
  cv_folds: 5
  scoring: "roc_auc"

output:
  metrics_file: "models/metrics.json"
  feature_importance_plot: "models/feature_importance.png"